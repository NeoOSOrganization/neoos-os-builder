kernel:
  version: "main"    # a branch, tag, or "main"

tests:
  include: false     # pull the ~65-program regression suite into the image?
                      # false by default -- a production image shouldn't
                      # carry the regression suite just because it's handy
                      # in development.

ports:
  - busybox
  - 3d-ascii-viewer
  - doom

shell:
  interactive: false  # boot to an nsh login prompt (god/god, neo/neo)
                      # instead of the automated test-boot marker?
                      # Mutually exclusive with tests.include: true --
                      # a human login and key-injecting regression
                      # tests cannot share one tty.

iso:
  name: "neoos-custom-build"
