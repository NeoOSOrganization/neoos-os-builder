name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 xorriso grub-common grub-pc-bin mtools nasm
      - name: checkout neoos-kernel (toolchain/build.sh only)
        run: git clone --depth 1 https://github.com/NeoOSOrganization/neoos-kernel neoos-kernel-ref
      - name: cache cross-toolchain
        uses: actions/cache@v4
        with:
          path: ~/opt/cross-x86_64-elf
          key: x86_64-elf-toolchain-${{ hashFiles('neoos-kernel-ref/toolchain/build.sh') }}
      - name: build cross-toolchain (skips if cache hit)
        run: neoos-kernel-ref/toolchain/build.sh
      - name: build a custom image (config/example.yaml)
        run: |
          export PATH="$HOME/opt/cross-x86_64-elf/bin:$PATH"
          make CONFIG=config/example.yaml
      - name: verify output
        run: |
          ls build/*.iso build/disk1.img build/disk2.img build/metadata.json build/qemu-run.sh
